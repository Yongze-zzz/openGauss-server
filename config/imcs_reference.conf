# Effective settings from /mnt/nvme1p1/yanyz/data/postgresql.conf.
# Duplicate settings are resolved using the last assignment in that file.
# The startup script preserves the target instance's node name, sets PORT,
# and overrides thread_pool_stream_attr for the requested DOP.
port = 5432
max_connections = 8192
session_timeout = 10min
memorypool_enable = true
enable_memory_limit = true
bulk_write_ring_size = 2GB
max_prepared_transactions = 24000
cstore_buffers = 100GB
wal_level = hot_standby
enable_incremental_checkpoint = on
incremental_checkpoint_timeout = 60s
enable_double_write = on
max_wal_senders = 4
wal_keep_segments = 16
enable_slot_log = off
max_replication_slots = 8
synchronous_standby_names = '*'
walsender_max_send_size = 8MB
hot_standby = on
enable_kill_query = off
logging_collector = on
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_size = 5MB
log_min_duration_statement = 1800000
log_connections = off
log_disconnections = off
log_duration = off
log_hostname = off
log_line_prefix = '%m %u %d %h %p %S '
log_timezone = 'PRC'
enable_alarm = on
connection_alarm_rate = 0.9
alarm_report_interval = 10
alarm_component = '/opt/snas/bin/snas_cm_cmd'
use_workload_manager = off
default_transaction_read_only = off
datestyle = 'iso, mdy'
timezone = 'PRC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
lockwait_timeout = 1200s
pgxc_node_name = 'db1'
audit_enabled = on
enable_codegen = on
job_queue_processes = 10
dolphin.nulls_minimal_policy = on
enable_sonic_hashagg = on
enable_sonic_hashjoin = on
enable_bloom_filter = on
sql_beta_feature = 'sel_semi_poisson, sel_expr_instr, rand_cost_opt, page_est_opt, param_path_opt'
enable_asp = off
enable_instr_cpu_timer = off
enable_instr_rt_percentile = off
enable_instr_track_wait = off
enable_resource_track = off
enable_user_metric_persistent = off
track_activities = off
instr_unique_sql_count = 0
track_sql_count = off
max_process_memory = 600GB
shared_buffers = 50GB
work_mem = 100GB
explain_perf_mode = pretty
max_imcs_cache = 256GB
enable_thread_pool = on
thread_pool_attr = '128,1,(nodebind: 0,1,2,3,4,5,6)'
thread_pool_stream_attr = '128,0.2,1,(nodebind: 0,1,2,3,4,5,6)'
